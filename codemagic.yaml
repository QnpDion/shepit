workflows:
  android-apk:
    name: Shepit — Android release APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Verify Flutter and Java toolchain
        script: |
          flutter --version
          java -version
          flutter doctor -v
      - name: Fetch Flutter packages
        script: flutter pub get
      - name: Run static analysis
        script: flutter analyze --no-fatal-infos
      - name: Run application smoke test
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/flutter-apk/*.apk
